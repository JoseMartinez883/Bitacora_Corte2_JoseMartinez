server.ssl.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Al usar MockitoBean, le damos una URL falsa para que no explote validando el texto vacío
spring.mongodb.uri=mongodb://localhost:27017/dummy_test_db

# Clave EXCLUSIVA para pruebas (no es la de producción, que viene de la variable JWT_SECRET)
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp1bml0LXRlc3RzLTEyMzQ1Njc4OTA=
jwt.expiration-ms=3600000

# Dummy properties para OAuth2 en test
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret