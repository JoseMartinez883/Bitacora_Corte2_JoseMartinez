# Servidor HTTPS (SSL/TLS). El .p12 NO se versiona: se genera con keytool (ver README)
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:restaurante.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=restaurante

# Relacional - PostgreSQL (Configuracion vista en clase)
spring.datasource.url=jdbc:postgresql://localhost:5432/bellaciao_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# No Relacional - MongoDB Atlas
spring.mongodb.uri=${MONGO_URI}

# Seguridad JWT (el secreto es obligatorio y se inyecta por variable de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
